###############################################################################
#                         PICOM CONFIGURATION (v13+)                         #
#             Optimized for Arch Linux, Qtile, Nouveau & Modern X11           #
###############################################################################

# =============================================================================
#  Backend & Hardware Acceleration
# =============================================================================
# 'glx' provides hardware acceleration & double-buffering (eliminates white flash)
# If your driver ever experiences GLX glitches, change to 'xrender' or 'egl'
backend = "xrender";

# Enable VSync to eliminate screen tearing (60Hz / 75Hz display synchronization)
vsync = true;

# Disable damage tracking to force clean full-frame swaps (prevents flickering)
use-damage = false;

# Disable unredirecting fullscreen windows to maintain compositing consistency
unredir-if-possible = false;

# Synchronize X11 and GLX draw queues using sync fences
xrender-sync-fence = true;

# =============================================================================
#  Transparency & Opacity
# =============================================================================
# Detect native 32-bit ARGB transparency on client windows
detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Default opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Opacity Rules (Ensures specific apps render crisply with native transparency)
opacity-rule = [
  "100:_NET_WM_STATE@[0]:a = '_NET_WM_STATE_FULLSCREEN'",
  "100:_NET_WM_STATE@[1]:a = '_NET_WM_STATE_FULLSCREEN'",
  "100:_NET_WM_STATE@[2]:a = '_NET_WM_STATE_FULLSCREEN'",
  "100:_NET_WM_STATE@[3]:a = '_NET_WM_STATE_FULLSCREEN'",
  "100:_NET_WM_STATE@[4]:a = '_NET_WM_STATE_FULLSCREEN'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'antigravity-ide'",
  "100:class_g = 'qtile'",
  "100:class_g = 'i3lock'"
];

# =============================================================================
#  Fading & Transitions (Smooth workspace & window opening)
# =============================================================================
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
no-fading-openclose = false;

fade-exclude = [
  "class_g = 'slop'",       # Flameshot screenshot selection
  "class_g = 'i3lock'"
];

# =============================================================================
#  Shadows
# =============================================================================
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "class_g = 'slop'",
  "class_g = 'Rofi'",
  "class_g = 'qtile'"
];

# =============================================================================
#  Window Type Settings
# =============================================================================
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; fade = false; };
  dropdown_menu = { opacity = 1.0; fade = false; };
  utility = { shadow = false; };
};
