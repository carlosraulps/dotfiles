# ==============================================================================
#  ~/.tmux.conf - Optimized for Arch Linux, OneDark & Session Persistence
# ==============================================================================

# --- General Terminal Settings ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on

# Base index for windows and panes (1-based for easy keyboard reach)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane splitting & navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi mode for buffer navigation & selection
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# --- OneDark Aesthetic Status Bar ---
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e222a,fg=#abb2bf"

set -g status-left "#[bg=#61afef,fg=#1e222a,bold] #S #[bg=#1e222a] "
set -g status-left-length 30

set -g window-status-format "#[fg=#5c6370] #I:#W "
set -g window-status-current-format "#[fg=#98c379,bold] #I:#W #[fg=#61afef]●"

set -g status-right "#[fg=#5c6370]%Y-%m-%d #[fg=#abb2bf]● #[fg=#61afef]%H:%M "
set -g status-right-length 50

# --- TPM & Session Persistence Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- tmux-resurrect Settings ---
# Capture pane scrollback contents
set -g @resurrect-capture-pane-contents 'on'

# Preserve Neovim sessions
set -g @resurrect-strategy-nvim 'session'

# Automatically restore custom interactive CLI programs
# Crucial: spotatui, btop, ranger, and lazygit are restored automatically!
set -g @resurrect-processes 'spotatui btop ranger lazygit "git log"'

# --- tmux-continuum Settings ---
# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'

# Continuous background autosave interval (in minutes)
set -g @continuum-save-interval '5'

# Initialize TPM (Keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
