# ===================================================================
# == General Settings
# ===================================================================

# View mode: miller (default), multipane
set viewmode miller

# Column ratios (parent, current, preview)
set column_ratios 1,3,4

# Show hidden files by default
set show_hidden true

# Confirm before deleting files: 'always', 'never', 'multiple'
set confirm_on_delete multiple

# Use preview script (scope.sh) for rich previews
set use_preview_script true

# Enable image previews
set preview_images true
set preview_images_method ueberzug

# Preview files and directories
set preview_files true
set preview_directories true
set collapse_preview true

# Line numbers
set line_numbers true
set relative_current_zero true
set one_indexed true

# Linemode with nerd font icons
default_linemode devicons

# Draw borders: none, visible, separators, outline, both
set draw_borders separators
set draw_progress_bar_in_status_bar true
set status_bar_on_top false

# Display metadata in columns / status bar
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true
set display_tags_in_all_columns true

# Window & tmux title
set update_title true
set update_tmux_title true
set shorten_title 3
set tilde_in_titlebar true

# History & scrolling
set max_history_size 1000
set max_console_history_size 200
set scroll_offset 8
set flushinput true
set padding_right true
set autosave_bookmarks true
set autoupdate_cumulative_size true

# Sorting
set sort natural
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true
set sort_unicode false

# Tab completion
set cd_bookmarks true
set cd_tab_case sensitive
set cd_tab_fuzzy true

# Git integration in ranger
set vcs_aware true
set vcs_backend_git enabled

# Clear filters when changing directories
set clear_filters_on_dir_change true

# ===================================================================
# == Keybindings
# ===================================================================

# Editor
map E shell nvim %f
map e edit

# Navigation & Search (fzf integration)
map <C-f> fzf_select
map <C-g> fzf_locate
map mkd console mkdir%space
map mkc console mkcd%space
map touch console touch%space

# Archives
map ex extract
map cc console compress%space

# Clipboard / Yanking
map ya copy path
map yd copy dir
map yn copy name
map y. copy name_without_extension

# Selection & Marking
map <Space> mark_files toggle=True
map v mark_files all=True toggle=True
map uv mark_files all=True val=False

# File Operations
map D console delete
map cw eval fm.execute_console("bulkrename") if fm.thisdir.marked_items else fm.open_console("rename ")
map bg shell feh --bg-fill %f
map <A-h> set show_hidden!

# Refresh / Reload
map R reload_cwd
map <C-r> reset



